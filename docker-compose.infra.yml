services:
  mysql:
    image: mysql:8.4
    container_name: sts-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: sts_db
      MYSQL_USER: sts_user
      MYSQL_PASSWORD: sts_pass
    ports:
      - "3306:3306"
    volumes:
      - sts_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:latest
    container_name: sts-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  sts_mysql_data:
